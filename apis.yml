aid: chowbus
name: Chowbus
description: 'Chowbus is a Chicago-headquartered restaurant technology company founded
  in 2016 by Linxin Wen and Suyu Zhang. It began as an online food ordering, payment
  and delivery marketplace for Asian restaurants and has since pivoted to a cloud-based,
  AI-assisted restaurant operating platform: point of sale, self-ordering kiosks,
  handheld and tablet ordering, kitchen display systems, waitlist and reservations,
  online ordering, branded restaurant websites and mobile apps, loyalty, gift cards,
  SMS marketing, a promotions engine, multi-location management, and an AI suite covering
  digital ads, social media, creative assets and review insights. Chowbus states it
  serves 9,000+ restaurants across all 50 U.S. states and Canada with 24/7 bilingual
  (EN/ZH/ES) support, and raised an $81M growth round in March 2026 led by Prysm Capital
  and Left Lane Capital. Its POS advertises two-way third-party delivery integration
  with 45+ marketplaces (DoorDash, Uber Eats, Grubhub and others), and partner-side
  aggregators such as Deliverect publish Chowbus POS connectors — but as of August
  2026 Chowbus publishes no public developer portal, API reference, OpenAPI/AsyncAPI
  contract, SDK, or sandbox. Its only machine-readable public agent surface is a hand-authored
  bilingual llms.txt at chowbus.com/llms.txt; a JSON API host (pos-api.chowbus.com)
  is live and returns a structured error envelope but is undocumented and gated.'
